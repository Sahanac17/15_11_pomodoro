<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="frame">
      <div class="art" id="art" aria-label="Artwork placeholder"></div>
    </div>
    <div class="time" id="time">00:15</div>
    <div class="buttons">
      <button type="button" class="button start" id="start-pause">Start</button>
      <button type="button" class="button reset" id="reset">Reset</button>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
