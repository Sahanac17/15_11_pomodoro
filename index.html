<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pomodoro Art</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <div class="frame">
      <div class="art" id="art" aria-label="Painting (blurred until the timer ends)"></div>
    </div>
    <div class="time" id="time">00:15</div>
    <div class="buttons">
      <button type="button" class="button start" id="start-pause">Start</button>
      <button type="button" class="button reset" id="reset">Reset</button>
      <button type="button" class="button start" id="restart" hidden>Restart session</button>
    </div>
    <p class="status" id="status" hidden></p>
    <div class="details" id="details" hidden>
      <b id="painting-title"></b>
      <span id="painting-info"></span><br>
      <a id="painting-link" href="#" target="_blank" rel="noopener noreferrer">Read about this painting</a>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
